version: 2.1

orbs:
  codecov: codecov/codecov@5.3.0

jobs:
  backend:
    docker:
      - image: cimg/openjdk:23.0
    working_directory: ~/user-manager
    steps:
      - checkout
      - restore_cache:
          keys:
            - maven-v2-{{ checksum "backend/pom.xml" }}
            - maven-v2-
      - run:
          name: Tests et vérifications backend
          command: cd backend && ./mvnw clean verify -Dspring.profiles.active=test
      - save_cache:
          paths:
            - ~/.m2
          key: maven-v2-{{ checksum "backend/pom.xml" }}
      - store_test_results:
          path: backend/target/surefire-reports
      - store_artifacts:
          path: backend/target/site/jacoco
          destination: coverage
      - codecov/upload:
          files: backend/target/site/jacoco/jacoco.xml
          flags: backend
          upload_name: user-manager-backend
          slug: lpreaux/usermanager

  frontend:
    docker:
      - image: cimg/node:22.19
    working_directory: ~/user-manager/frontend
    steps:
      - checkout:
          path: ~/user-manager
      - run:
          name: Activer pnpm
          command: sudo corepack enable
      - restore_cache:
          keys:
            - pnpm-v2-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-v2-
      - run:
          name: Installer les dépendances
          command: pnpm install --frozen-lockfile
      - save_cache:
          paths:
            - ~/.local/share/pnpm/store
          key: pnpm-v2-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: Lint et build frontend
          command: pnpm lint && pnpm build

workflows:
  build-and-test:
    jobs:
      - backend
      - frontend
